# Cloud agent: Docker bridge networking drops inter-container traffic.
# Run all services on the host network namespace.
services:
  immich-server:
    network_mode: host
    environment:
      DB_HOSTNAME: 127.0.0.1
      REDIS_HOSTNAME: 127.0.0.1
      IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
    depends_on: !override
      - redis
      - database

  immich-machine-learning:
    network_mode: host
    environment:
      IMMICH_PORT: "3003"

  redis:
    network_mode: host
    command: ["redis-server", "--save", "", "--port", "6379"]

  database:
    network_mode: host
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
